<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max AI - F1 Verstappen Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#F3F0FA; --muted:#B0A8CC; --accent:#FF1E38; --accent2:#00D2BE; --gold:#FFD700;
    --border:rgba(255,30,56,0.3); --surface:rgba(5,3,11,0.75); --surface2:rgba(255,30,56,0.15);
    --user-text:#ffffff;
  }
  *{box-sizing:border-box;}
  html, body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05030B;}
  
  /* Fix Stacking Context for Background Video */
  .bg-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #05030B;
  }
  .bg-video{
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: brightness(0.5);
  }

  #bgCanvas{position:fixed; inset:0; z-index:1; width:100%; height:100%; pointer-events:none;}
  
  .grid-bg{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background-image: linear-gradient(rgba(255,30,56,0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,30,56,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove{0%{background-position:0 0;}100%{background-position:40px 40px;}}

  /* App UI Container sits above video (z-index: 10) */
  body{
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    position:relative;
    z-index: 10;
  }

  .hero{display:flex; flex-direction:column; align-items:center; padding:12px 16px 8px; border-bottom:1px solid var(--border); background:rgba(5,3,11,0.85); backdrop-filter:blur(10px); flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .brand span{width:10px; height:10px; border-radius:50%; background:var(--accent2); box-shadow:0 0 12px var(--accent2), 0 0 24px var(--accent);}
  
  h1{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:900; margin:0; letter-spacing:1px; background:linear-gradient(90deg, #fff, var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
  .tagline{color:var(--muted); font-size:10px; margin:2px 0 4px; text-transform:uppercase; letter-spacing:1.5px;}
  
  .max-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 0 25px rgba(255,215,0,0.4), inset 0 0 12px rgba(255,30,56,0.5);
    margin: 2px 0 4px 0;
    position: relative;
    animation: f1Float 3.5s ease-in-out infinite;
    background: #111;
  }
  .max-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.05);
  }
  @keyframes f1Float {
    0%, 100% { transform: translateY(0) rotate(0deg); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    50% { transform: translateY(-3px) rotate(1deg); box-shadow: 0 0 30px rgba(255,30,56,0.6); }
  }

  #keyBar{padding:8px 16px; background:rgba(255,30,56,0.15); border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; font-size:13px; backdrop-filter:blur(6px); flex-shrink:0;}
  #keyBar input{flex:1; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:10px; font-size:13px; font-family:monospace; outline:none;}
  #keyBar button{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:6px 12px; font-weight:600; font-size:12px; cursor:pointer;}
  #keyStatus{color:var(--accent2); font-size:12px; white-space:nowrap; font-weight:600;}

  main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; max-width:640px; width:100%; margin:0 auto;}
  
  .msg{max-width:85%; padding:12px 16px; border-radius:16px; font-size:14.5px; line-height:1.6; white-space:pre-wrap; animation:fadeIn 0.3s ease; backdrop-filter:blur(6px);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
  
  .msg.ai{background:rgba(255,30,56,0.25); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 4px 20px rgba(0,0,0,0.3);}
  .msg.user{background:linear-gradient(135deg, var(--accent), #ff527b); color:var(--user-text); align-self:flex-end; border-bottom-right-radius:4px; font-weight:500; box-shadow:0 4px 20px rgba(255,30,56,0.3);}
  
  .empty{color:var(--text); font-size:13.5px; text-align:center; margin-top:20px; line-height:1.8; background:rgba(5,3,11,0.7); backdrop-filter:blur(8px); padding:20px; border-radius:16px; border:1px dashed var(--border);}
  
  footer{border-top:1px solid var(--border); padding:10px 16px; flex-shrink:0; background:rgba(5,3,11,0.9); backdrop-filter:blur(10px);}
  .chat-form-container{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:8px;}
  
  form{display:flex; gap:10px;}
  input[type=text]{flex:1; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:12px; font-size:14px; font-family:inherit; outline:none; transition:border-color 0.3s;}
  input[type=text]:focus{border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,0,0.3);}
  
  button[type=submit]{background:linear-gradient(135deg, var(--gold), #ffa500); color:#000; border:none; border-radius:12px; padding:0 18px; font-weight:800; font-size:12.5px; cursor:pointer; text-transform:uppercase;}

  .upload-strip {display: flex; gap: 8px; align-items: center;}
  .upload-chip {
    background: rgba(0,0,0,0.4); border: 1px dashed var(--border); padding: 4px 10px; border-radius: 6px;
    font-size: 11px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .upload-chip input { display: none; }
  .preview-indicator { font-size: 11px; color: var(--accent2); background: rgba(0,210,190,0.25); padding: 2px 6px; border-radius: 4px; display: none; align-items: center; gap: 6px;}
</style>
<script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.run/@google/genai"
    }
  }
</script>
</head>
<body>

<!-- Dedicated Background Layer with Video Container -->
<div class="bg-container">
    <video autoplay muted loop playsinline class="bg-video" id="bgVideo">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-formula-one-racing-car-driving-at-high-speed-41604-large.mp4" type="video/mp4">
        <source src="max%20vidio.mp4" type="video/mp4">
        Aapka browser video tag support nahi karta.
    </video>
</div>

<canvas id="bgCanvas"></canvas>
<div class="grid-bg"></div>

<div class="hero">
  <div class="brand"><span></span><h1>MAX AI</h1><span></span></div>
  <p class="tagline">World Champion Assistant</p>
  <div class="max-avatar">
    <img src="max ai.jpg" alt="Max AI" onerror="this.src='https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=300&h=300&fit=crop'">
  </div>
</div>

<div id="keyBar">
  <span id="keyStatus">API Key Required</span>
  <input type="password" id="apiKey" placeholder="Paste your Gemini API key (AQ...)">
  <button id="saveKey">Connect</button>
</div>

<main id="chat">
  <div class="empty" id="emptyState">⚡ Speed up! Set your Gemini API key above and start chatting with Max AI.</div>
</main>

<footer>
  <div class="chat-form-container">
    <div class="upload-strip">
      <label class="upload-chip">
        📷 Add Photo <input type="file" id="imageInputFile" accept="image/*" onchange="handleFile(event, 'image')">
      </label>
      <label class="upload-chip">
        📄 Add Document <input type="file" id="docInputFile" accept=".pdf,.txt,.doc,.docx" onchange="handleFile(event, 'doc')">
      </label>
      <div class="preview-indicator" id="fileIndicator">
        <span id="fileNameDisplay">file selected</span>
        <span style="cursor:pointer; color:#ff4d4d; font-weight:bold;" onclick="clearFile()">✕</span>
      </div>
    </div>

    <form id="form">
      <input type="text" id="input" placeholder="Talk to Max..." autocomplete="off">
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
</footer>

<script type="module">
import { GoogleGenAI } from "@google/genai";

window.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('bgVideo');
    if(video) { 
        video.muted = true; 
        video.play().catch(e => console.log("Autoplay blocked:", e));
    }
});

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const count = Math.floor((canvas.width * canvas.height) / 8000);
  stars = Array.from({length: count}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.4,
    phase: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 1
  }));
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let t = 0;
function drawStars(){
  t += 0.025;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    const twinkle = (Math.sin(t * s.speed + s.phase) + 1) / 2;
    ctx.globalAlpha = 0.2 + twinkle * 0.7;
    ctx.fillStyle = s.phase > 3 ? '#FF1E38' : '#00D2BE';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

let apiKey = '';
let aiClient = null;
const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const keyStatus = document.getElementById('keyStatus');
const keyBar = document.getElementById('keyBar');
let chatSession = null;
let selectedFileObject = null;

const savedKey = localStorage.getItem('gemini_api_key');
if(savedKey){
  apiKey = savedKey;
  aiClient = new GoogleGenAI({ apiKey: apiKey });
  chatSession = aiClient.chats.create({
    model: 'gemini-3.6-flash',
    config: {
      systemInstruction: 'Your name is Max, inspired by F1 champion Max Verstappen. You are fast, sharp, energetic, and extremely helpful.'
    }
  });
  keyBar.style.display = 'none';
}

document.getElementById('saveKey').addEventListener('click', () => {
  const val = document.getElementById('apiKey').value.trim();
  if(val){
    apiKey = val;
    localStorage.setItem('gemini_api_key', val);
    aiClient = new GoogleGenAI({ apiKey: apiKey });
    chatSession = aiClient.chats.create({
      model: 'gemini-3.6-flash',
      config: {
        systemInstruction: 'Your name is Max, inspired by F1 champion Max Verstappen. You are fast, sharp, energetic, and extremely helpful.'
      }
    });
    keyStatus.textContent = 'Connected ✓';
    document.getElementById('apiKey').value = '';
    setTimeout(() => { keyBar.style.display = 'none'; }, 600);
  }
});

window.handleFile = function(event, type) {
  const file = event.target.files[0];
  if(!file) return;
  selectedFileObject = file;
  const indicator = document.getElementById('fileIndicator');
  const nameDisplay = document.getElementById('fileNameDisplay');
  nameDisplay.textContent = file.name;
  indicator.style.display = 'flex';
}

window.clearFile = function() {
  selectedFileObject = null;
  document.getElementById('imageInputFile').value = '';
  document.getElementById('docInputFile').value = '';
  document.getElementById('fileIndicator').style.display = 'none';
}

function addMsg(role, text){
  if(emptyState) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

const form = document.getElementById('form');
const sendBtn = document.getElementById('sendBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text && !selectedFileObject) return;
  if(!apiKey || !chatSession){
    keyBar.style.display = 'flex';
    addMsg('ai', 'Please connect your Gemini API key first!');
    return;
  }
  
  let displayText = text;
  if(selectedFileObject) {
    displayText += ` [Attached: ${selectedFileObject.name}]`;
  }
  
  input.value = '';
  clearFile();
  sendBtn.disabled = true;
  addMsg('user', displayText);
  const thinking = addMsg('ai', '⚡ Accelerating response...');

  try{
    const result = await chatSession.sendMessage({ message: text || "Analyze this file." });
    thinking.textContent = result.text;
  }catch(err){
    thinking.textContent = 'Error: ' + (err.message || 'Server is busy, try again in a moment.');
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
